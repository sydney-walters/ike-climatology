[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ike-climatology"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "matplotlib>=3.8",
    "seaborn>=0.13,<0.14",
    "cartopy>=0.22",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]
